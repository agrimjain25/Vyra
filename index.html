/* VYRA / SIGNAL FIELD — signature art direction */
:root{
  --bg:#0b0c10;--s:#12141a;--s2:#191c24;--t:#f3f2ee;--t2:#9b9eaa;

  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f2ec;--s:#fffefa;--s2:#e9e8e0;--t:#17191b;--t2:#696c75;

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#view:focus,#view h1:focus{outline:none}
:root[data-theme="light"] .err,.err{font-weight:600}
.btn[disabled],button:disabled{opacity:.5;cursor:not-allowed;transform:none}
#view,.card,.aud,td,.persona-text{overflow-wrap:anywhere}
#q{max-width:100%}
.err{overflow-wrap:anywhere}
@media(max-width:760px){main{padding-left:16px;padding-right:16px}.btn,.nav,select,input,textarea{min-height:44px}.btn.sm{min-height:44px;padding:8px 12px}.row{min-width:0}#q,#fs{width:100%!important}.card{padding:16px}.top{flex-wrap:wrap}#toast{max-width:calc(100vw - 32px);text-align:center}}
@media(max-width:480px){.steps{gap:6px}.step{padding:8px 10px}}

/* contrast fixes (same hues, AA ratios) */
:root[data-theme="light"] .nav-caption{color:#66627c}
:root[data-theme="light"] .eyebrow{color:#5a4ec0}
:root[data-theme="light"] .mini-label{color:#5f5a78}
:root[data-theme="light"] .studio-mark{color:#5a4fa0}
:root[data-theme="light"] .tag,:root[data-theme="light"] .persona-text small{color:#51545e}
:root[data-theme="light"] .persona.selected small,:root[data-theme="light"] .format-option.active small{color:#4a3bb0}
:root[data-theme="light"] .preview-live{color:#1f6b4b}
:root[data-theme="light"] .insight-strip small{color:#3d5a4a}
:root[data-theme="dark"] .btn.g{background:var(--s2);color:var(--t)}
:root[data-theme="dark"] .persona-need{color:#cfc6ff}
:root[data-theme="dark"] .message-preview,:root[data-theme="dark"] .campaign-choice,:root[data-theme="dark"] .persona.selected,:root[data-theme="dark"] .format-option.active{background:var(--s2);border-color:var(--b)}
:root[data-theme="dark"] .message-preview h3,:root[data-theme="dark"] .campaign-choice b,:root[data-theme="dark"] .step.on{color:var(--t)}
:root[data-theme="dark"] .campaign-choice small,:root[data-theme="dark"] .mini-label,:root[data-theme="dark"] .preview-top>span:first-child,:root[data-theme="dark"] .insight-strip small{color:var(--t2)}
:root[data-theme="dark"] .persona.selected small,:root[data-theme="dark"] .format-option.active small,:root[data-theme="dark"] .preview-badge,:root[data-theme="dark"] .preview-live{color:var(--m)}
:root[data-theme="dark"] .step.on{background:var(--v)}
:root[data-theme="light"] .nav-caption{color:#66627c!important;opacity:1!important}
:root[data-theme="light"] .hero-primary{color:#fff!important}
:root[data-theme="dark"] #theme{background:var(--s2)!important;color:var(--t)!important}
:root[data-theme="light"] .nav-copy small{color:#5b5870!important;opacity:1!important}

/* ===== VYRA backend-connected UI (Phase 2) ===== */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;border:1px solid var(--b);background:var(--s);white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ready{color:var(--ok)}.pill.needs_review{color:var(--wr)}.pill.draft{color:var(--t2)}.pill.failed{color:var(--er)}.pill.info{color:var(--a)}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 7px;border:1px solid var(--b);color:var(--t2);text-transform:uppercase}
.badge.error{color:var(--er);border-color:var(--er)}.badge.warning{color:var(--wr);border-color:var(--wr)}.badge.info{color:var(--a);border-color:var(--a)}
.badge.by{background:var(--v);color:var(--a);text-transform:none;letter-spacing:.02em}.badge.ai{background:var(--v);color:var(--a)}.badge.rule{background:var(--s2)}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--b);border-left-width:4px;border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--s);font-size:13px}
.banner.err{border-left-color:var(--er)}.banner.warn{border-left-color:var(--wr)}.banner.info{border-left-color:var(--a)}.banner.ok{border-left-color:var(--ok)}
.banner b{display:block}.banner .grow{flex:1;min-width:0}
.imgslot{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--v);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--t2);margin:0 0 12px;padding:10px}
.imgslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.imgslot .stack{display:grid;gap:8px;justify-items:center;max-width:90%}
.skel{animation:vpulse 1.4s ease-in-out infinite}
@keyframes vpulse{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
.meta{font-size:11px;color:var(--t2);line-height:1.6}
.meta b{color:var(--t)}
.finding{border-top:1px solid var(--b);padding:11px 0;font-size:13px}
.finding:first-of-type{border-top:0}
.finding .row{gap:6px}
.finding q{display:block;margin:6px 0;padding:6px 10px;border-left:3px solid var(--b);color:var(--t2);font-style:italic;quotes:none}
details.more{margin:8px 0;font-size:12px}details.more summary{cursor:pointer;color:var(--a);font-weight:600}
details.more p{margin:6px 0;color:var(--t2)}
.tabrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.story{max-width:760px;margin:0 auto}
.story .scene-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;margin-bottom:16px;background:var(--v)}
.story h1{font-size:clamp(26px,4vw,38px);margin:0 0 10px}
.story .narr{font:400 19px/1.6 var(--f);margin:0 0 20px}
.choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--b);border-radius:12px;background:var(--s);padding:14px 16px;cursor:pointer;font-weight:600;color:var(--t)}
.choice:hover{border-color:var(--a);background:var(--v)}
.trail{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--t2);margin:0 0 14px}
.trail span:not(:last-child):after{content:" →";margin-left:6px}
.ad-frame{position:relative;margin:0 12px 12px;border-radius:13px;overflow:hidden;background:var(--v);aspect-ratio:var(--ar,1/1);max-height:560px;display:grid;place-items:center;justify-self:center;width:calc(100% - 24px)}
.ad-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ad-text{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 20px;background:linear-gradient(to top,#000000cc,#00000000);color:#fff}
.ad-text h2{font:600 clamp(22px,3vw,34px)/1.05 var(--f);margin:0 0 8px;color:#fff}.ad-text span{display:inline-block;background:#fff;color:#15161a;font-weight:700;font-size:12px;border-radius:999px;padding:6px 12px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar .track{flex:1;background:var(--v);border-radius:6px}.bar .fill{height:14px;background:var(--a);border-radius:6px;min-width:2px}
.integ{border:1px solid var(--b);border-radius:14px;padding:16px;background:var(--s);display:grid;gap:8px}
.integ h3{font:700 16px var(--u);letter-spacing:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:12px}.kv dt{color:var(--t2)}.kv dd{margin:0;word-break:break-word}
table.dense td,table.dense th{padding:7px 8px;font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.inline-form textarea{min-height:90px}
.file-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sidestatus{display:grid;gap:4px}.sidestatus .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--t2)}
.dot.verified_working{background:var(--ok)!important}.dot.configured,.dot.local_test_endpoint{background:var(--wr)!important}.dot.error{background:var(--er)!important}
.err-text{color:var(--er)}
@media(max-width:600px){.story .narr{font-size:17px}}

/* =====================================================================
   VYRA / PRISM — final visual layer (visual only; no behaviour changes)
   Idea: one brand beam enters a prism and splits into one colour per audience.
   violet = Athletes · coral = Style lovers · mint = Eco shoppers
   ===================================================================== */
:root{
  --c1:#8f7dff;--c2:#ff7f9f;--c3:#4fe3c8;--c4:#ffc56e;
  --prism:linear-gradient(100deg,var(--c1) 0%,var(--c2) 42%,var(--c4) 68%,var(--c3) 100%);
  --glass-hi:#ffffff12;
}
:root,:root[data-theme="dark"]{
  --bg:#070813;--s:#0f1120;--s2:#171a2e;--t:#f2f1fb;--t2:#a2a4c0;
  --a:#a99bff;--ah:#bfb4ff;--v:#1d1b3d;--m:#4fe3c8;--b:#262a45;
  --ok:#5eead4;--wr:#ffd27d;--er:#ff9eb0;--on:#ffffff;color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="light"]{
  --bg:#f3f2fb;--s:#ffffff;--s2:#ebe9f7;--t:#15142a;--t2:#5d5f7c;
  --a:#5a40e0;--ah:#4730c8;--v:#ebe7ff;--m:#14a98f;--b:#dddcf0;
  --c1:#6a53f0;--c2:#e0507c;--c3:#10a58b;--c4:#e39a2c;--glass-hi:#ffffffaa;color-scheme:light;
}
::selection{background:color-mix(in srgb,var(--c1) 45%,transparent);color:var(--t)}
html{scrollbar-color:color-mix(in srgb,var(--c1) 40%,var(--b)) transparent;scrollbar-width:thin}

/* living backdrop: three slow colour fields + fine grain */
body{background:var(--bg);position:relative}
body:before{opacity:.16}
body:after{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
  background:radial-gradient(38% 34% at 18% 22%,color-mix(in srgb,var(--c1) 34%,transparent),transparent 70%),
             radial-gradient(34% 30% at 84% 14%,color-mix(in srgb,var(--c2) 22%,transparent),transparent 70%),
             radial-gradient(40% 34% at 70% 88%,color-mix(in srgb,var(--c3) 20%,transparent),transparent 70%);
  filter:blur(40px);animation:fieldDrift 46s ease-in-out infinite alternate}
:root[data-theme="light"] body:after{opacity:.55}
@keyframes fieldDrift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}

/* sidebar */
aside{background:linear-gradient(180deg,color-mix(in srgb,var(--s) 78%,transparent),color-mix(in srgb,var(--bg) 88%,transparent));backdrop-filter:blur(22px) saturate(1.3)}
.logo{background:none}
.logo svg path{stroke:var(--c1);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c1) 70%,transparent))}
.logo svg circle{fill:var(--c4);stroke:var(--c2)}
.logo{background:var(--prism);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo svg{-webkit-text-fill-color:initial}
.logo:after{-webkit-text-fill-color:var(--t2);color:var(--t2)}
.nav{position:relative}
.nav[aria-current=page]{background:linear-gradient(95deg,color-mix(in srgb,var(--c1) 22%,transparent),color-mix(in srgb,var(--c2) 8%,transparent));border-color:color-mix(in srgb,var(--c1) 38%,transparent);box-shadow:inset 3px 0 0 var(--c1),0 8px 24px color-mix(in srgb,var(--c1) 14%,transparent);color:var(--t)}
.nav[aria-current=page] .nav-ico{background:color-mix(in srgb,var(--c1) 30%,transparent);color:var(--t)}
.nav-ico{background:color-mix(in srgb,var(--t) 6%,transparent)}
.nav-plus{background:var(--prism);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--c2) 35%,transparent)}
.note{background:linear-gradient(140deg,color-mix(in srgb,var(--c1) 12%,var(--s)),var(--s));border-color:color-mix(in srgb,var(--c1) 22%,var(--b))}
.top #crumb:before{background:var(--c3);box-shadow:0 0 0 4px color-mix(in srgb,var(--c3) 18%,transparent),0 0 14px var(--c3)}
#theme{backdrop-filter:blur(8px);border-radius:99px}

/* buttons: prism fill with a light sweep on hover */
.btn{position:relative;overflow:hidden;background:linear-gradient(110deg,var(--c1),color-mix(in srgb,var(--c1) 55%,var(--c2)));color:#fff;border:0;box-shadow:0 8px 22px color-mix(in srgb,var(--c1) 30%,transparent),inset 0 1px 0 #ffffff40}
.btn:hover{background:linear-gradient(110deg,var(--ah),color-mix(in srgb,var(--c1) 40%,var(--c2)));box-shadow:0 12px 30px color-mix(in srgb,var(--c1) 42%,transparent),inset 0 1px 0 #ffffff50}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff38 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
.btn:hover:after{transform:translateX(120%)}
.btn.g,.btn.g:hover{background:color-mix(in srgb,var(--s2) 70%,transparent);color:var(--t);border:1px solid var(--b);box-shadow:inset 0 1px 0 var(--glass-hi);backdrop-filter:blur(8px)}
.btn.g:hover{border-color:color-mix(in srgb,var(--c1) 65%,var(--b));background:color-mix(in srgb,var(--c1) 12%,var(--s2))}
.btn.g:after{display:none}
:root[data-theme="light"] .hero-primary{color:#fff!important}
.hero-primary{background:var(--prism)!important;background-size:160% 100%!important;color:#14102e!important;box-shadow:0 10px 34px color-mix(in srgb,var(--c2) 32%,transparent),inset 0 1px 0 #ffffff66!important;transition:background-position .5s ease,transform .2s,box-shadow .2s}
:root[data-theme="light"] .hero-primary{color:#14102e!important}
.hero-primary:hover{background-position:100% 0!important}
.button-spark{background:#14102e26}

/* glass surfaces with a cursor-following sheen (position set by a tiny helper script) */
.card,.aud,.stat,.integ,.persona,.persona-detail,.media-controls,.creative-preview,.guide,.banner,.choice{
  background-image:radial-gradient(420px circle at var(--mx,50%) var(--my,-40%),color-mix(in srgb,var(--c1) 15%,transparent),transparent 58%),linear-gradient(160deg,color-mix(in srgb,var(--s) 96%,transparent),color-mix(in srgb,var(--s) 82%,transparent));
  background-color:var(--s);border-color:var(--b);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 44px #00000026}
:root[data-theme="light"] .card,:root[data-theme="light"] .aud,:root[data-theme="light"] .stat,:root[data-theme="light"] .integ,:root[data-theme="light"] .persona,:root[data-theme="light"] .persona-detail,:root[data-theme="light"] .media-controls,:root[data-theme="light"] .creative-preview,:root[data-theme="light"] .guide,:root[data-theme="light"] .banner,:root[data-theme="light"] .choice{box-shadow:0 1px 0 #fff inset,0 14px 36px #3a2f8014}
.card:hover,.persona:hover,.choice:hover{border-color:color-mix(in srgb,var(--c1) 55%,var(--b))}
.persona.selected,.format-option.active{background-image:linear-gradient(110deg,color-mix(in srgb,var(--c1) 22%,transparent),color-mix(in srgb,var(--c2) 8%,transparent));box-shadow:inset 3px 0 0 var(--c1),0 12px 30px color-mix(in srgb,var(--c1) 14%,transparent)}
.persona-detail{background-image:radial-gradient(ellipse at 100% 0%,color-mix(in srgb,var(--c1) 22%,transparent) 0,transparent 46%),linear-gradient(160deg,var(--s),color-mix(in srgb,var(--s) 85%,var(--c2)))}

/* audience cards: each audience owns one prism colour everywhere */
.aud:before{height:3px;background:linear-gradient(90deg,var(--c1),color-mix(in srgb,var(--c1) 30%,transparent))}
.aud:nth-child(2):before{background:linear-gradient(90deg,var(--c2),color-mix(in srgb,var(--c2) 30%,transparent))}
.aud:nth-child(3):before{background:linear-gradient(90deg,var(--c3),color-mix(in srgb,var(--c3) 30%,transparent))}
.aud:nth-child(2) .cta{color:var(--c2);background:color-mix(in srgb,var(--c2) 14%,transparent);border-color:color-mix(in srgb,var(--c2) 28%,transparent)}
.aud:nth-child(3) .cta{color:var(--c3);background:color-mix(in srgb,var(--c3) 14%,transparent);border-color:color-mix(in srgb,var(--c3) 28%,transparent)}
.stat:before{background:var(--c1);box-shadow:0 0 14px var(--c1)}
.stat:nth-child(2):before{background:var(--c3);box-shadow:0 0 14px var(--c3)}
.stat:nth-child(3):before{background:var(--c2);box-shadow:0 0 14px var(--c2)}
.stat:nth-child(4):before{background:var(--c4);box-shadow:0 0 14px var(--c4)}
.stat b{background:var(--prism);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.stat:after{color:var(--t2)}
.persona-icon.violet,.detail-icon.violet{background:color-mix(in srgb,var(--c1) 20%,transparent);color:var(--c1)}
.persona-icon.rose,.detail-icon.rose{background:color-mix(in srgb,var(--c2) 20%,transparent);color:var(--c2)}
.persona-icon.mint,.detail-icon.mint{background:color-mix(in srgb,var(--c3) 20%,transparent);color:var(--c3)}
.cta{background:color-mix(in srgb,var(--c1) 16%,transparent);color:var(--a)}
.tag,.interest-pill{backdrop-filter:blur(6px)}
.step.on{background:color-mix(in srgb,var(--c1) 24%,transparent);border-color:var(--c1);box-shadow:0 0 18px color-mix(in srgb,var(--c1) 25%,transparent)}
.pill{backdrop-filter:blur(6px)}

/* HERO — the prism */
.hero{border-color:color-mix(in srgb,var(--c1) 28%,#2b2e4a);background:
  radial-gradient(60% 90% at 88% 10%,color-mix(in srgb,var(--c1) 30%,transparent),transparent 65%),
  radial-gradient(40% 60% at 6% 100%,color-mix(in srgb,var(--c3) 16%,transparent),transparent 70%),
  linear-gradient(120deg,#0a0b18 0%,#0e1024 55%,#17133a 100%);
  box-shadow:0 40px 90px #02030c80,0 0 0 1px #ffffff08 inset;color:#f3f2fb}
.hero:before{border-color:#ffffff1a;box-shadow:0 0 0 34px #8f7dff10,0 0 0 82px #ff7f9f0b,0 0 0 140px #4fe3c808}
.hero:after{width:3px;background:linear-gradient(var(--c1),var(--c2),var(--c4),var(--c3))}
.hero .eyebrow{color:#c9c2ff}
.hero .eyebrow i{background:var(--c3);box-shadow:0 0 0 4px #4fe3c81f,0 0 20px #4fe3c8aa}
.hero h1{color:#f6f5ff;text-wrap:balance}
.hero h1 em{-webkit-box-decoration-break:clone;box-decoration-break:clone;background:var(--prism);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:prismShift 9s ease-in-out infinite alternate;padding-right:.06em}
@keyframes prismShift{to{background-position:100% 0}}
.hero p{color:#b9b8d2}
.hero-secondary{background:#ffffff0d!important;border-color:#ffffff24!important;color:#ecebfa!important}
.hero-proof{color:#b3b2cc}
.proof-dot,.pulse-dot{background:var(--c3);box-shadow:0 0 0 4px #4fe3c81a,0 0 16px #4fe3c8aa}
.hero-index,.visual-index{color:#a7a5c6}.visual-index span{color:var(--c4)}
.constellation-grid{opacity:.22;background:linear-gradient(#a8a3ff22 1px,transparent 1px),linear-gradient(90deg,#a8a3ff22 1px,transparent 1px);background-size:28px 28px}
.visual-orbit{border-color:#ffffff22}
.orbit-one{border-color:color-mix(in srgb,var(--c1) 55%,transparent)}
.orbit-two{border-color:color-mix(in srgb,var(--c3) 50%,transparent)}
.orbit-three{border-color:color-mix(in srgb,var(--c2) 50%,transparent)}
/* prism aura behind the core */
.hero-visual:before{content:"";position:absolute;z-index:0;width:250px;height:250px;border-radius:50%;left:50%;top:50%;margin:-125px 0 0 -125px;
  background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c4),var(--c3),var(--c1));filter:blur(46px);opacity:.5;animation:slowSpin2 24s linear infinite}
@keyframes slowSpin2{to{transform:rotate(360deg)}}
.visual-core{background:conic-gradient(from 210deg,#8f7dff,#ff7f9f,#ffc56e,#4fe3c8,#8f7dff);box-shadow:0 0 0 12px #ffffff0a,0 0 80px #8f7dff55,0 0 120px #ff7f9f22,inset 0 1px 0 #ffffffb0;animation:coreFloat 5s ease-in-out infinite}
.visual-core:before{inset:7px;border:0;border-radius:31px;background:linear-gradient(150deg,#161838,#0c0d20);box-shadow:inset 0 1px 0 #ffffff26}
.visual-core span{position:relative;font-style:italic;font-weight:600;background:var(--prism);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.visual-core i{background:var(--c4);color:#2a1a00;box-shadow:0 8px 26px #ffc56e66}
.orbit-node{background:#12142bd9;border-color:#ffffff1f;box-shadow:0 14px 34px #0006,inset 0 1px 0 #ffffff14}
.orbit-node:hover,.orbit-node:focus-visible{background:#1a1d3b;box-shadow:0 18px 40px #0007}
.node-athlete .node-symbol{background:#8f7dff26;color:var(--c1)}.node-athlete:hover,.node-athlete:focus-visible{border-color:var(--c1)}
.node-trend .node-symbol{background:#ff7f9f26;color:var(--c2)}.node-trend:hover,.node-trend:focus-visible{border-color:var(--c2)}
.node-conscious .node-symbol{background:#4fe3c826;color:var(--c3)}.node-conscious:hover,.node-conscious:focus-visible{border-color:var(--c3)}
.orbit-node b{color:#f3f2fb}.orbit-node small{color:#aeadc9}
.label-line{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3))}
.constellation-label{color:#b4b2d0}
/* one orchestrated load moment: hero copy rises in sequence */
.hero-copy>*{animation:heroRise .9s cubic-bezier(.2,.7,.2,1) both}

/* ---------- state ---------- */
const S = { campaigns: null, brand: null, health: null, integrations: null, analytics: null, example: null, offline: false, needToken: false };

/* ---------- API ---------- */
class ApiErr extends Error { constructor(status, code, message, details) { super(message); this.status = status; this.code = code; this.details = details; } }

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- small helpers ---------- */
function toast(m) { const t = $('#toast'); t.hidden = false; t.textContent = ''; clearTimeout(toast.h); setTimeout(() => { t.textContent = m; }, 60); toast.h = setTimeout(() => { t.hidden = true; t.textContent = ''; }, 4200); }

/* ---------- loaders ---------- */
async function loadHealth() { try { S.health = await api('GET', '/api/health'); } catch (e) { S.health = null; } renderStatus(); }

function startWatch() {

/* ---------- routing ---------- */

/* ---------- guide text ---------- */

function results() {
  if (loadingCur && !cur) return '<div class="card" style="text-align:center;padding:60px"><div class="spin"></div><p role="status">Loading campaign…</p></div>';

    (curError ? errBanner('Connection problem.', ' ' + curError.message) : '') +
    (running ? `<div class="banner info" role="status"><div class="spin" style="margin:0;width:20px;height:20px"></div><div class="grow"><b>Working…</b>${esc(jp)}</div></div>` : '') +
    (needGen ? `<div class="banner warn"><div class="grow"><b>No content yet.</b>Nothing has been generated for this campaign.</div><button class="btn sm" data-regen>Generate with AI</button></div>` : '') +

    strategyCard(c) + `<div class="grid g3">${c.experiences.map(e => expCard(e, c)).join('')}</div>` + findingsCard(c) + toneCard(c) + usageCard(c);
}

/* ---------- Story player ---------- */
async function openStory(expId) {
  story = { expId, path: [], scene: null, ended: false, loading: true, err: null, meta: null };
  render(1);
  try { await playStep(); } catch (e) { story.err = e.message; }
  story.loading = false; render(1);
}
async function playStep(sceneId, choiceId, label) {
  const body = { session_id: SESSION }; if (sceneId) { body.scene_id = sceneId; body.choice_id = choiceId; }
  const r = await api('POST', '/api/experiences/' + story.expId + '/play', body);
  story.scene = r.scene; story.ended = r.is_ending; story.meta = r.experience;
  if (!sceneId) story.path = [r.scene.title]; else story.path.push(label + ' → ' + r.scene.title);
}
function storyView() {
  if (!story) return '';
  if (story.loading) return '<div class="card" style="text-align:center;padding:60px"><div class="spin"></div><p role="status">Opening the story…</p></div>';
  if (story.err) return errBanner('Could not open this story.', ' ' + story.err) + '<button class="btn" data-go="overview">Back to Home</button>';
  const s = story.scene, m = story.meta;
  return `<div class="story"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow"><i></i> ${esc(m.audience.toUpperCase())} · ${esc(m.headline)}</span><button class="btn g sm" data-storyback>← Back to campaign</button></div><div class="trail" aria-label="Your path">${story.path.map(p => `<span>${esc(p)}</span>`).join('')}</div>` +
    (s.image_url ? `<img class="scene-img" src="${esc(media(s.image_url))}" alt="${esc('Illustration for ' + s.title)}">` : '') +
    `<h1>${esc(s.title)}</h1><p class="narr" aria-live="polite">${esc(s.narration)}</p>` +
    (story.ended ? `<div class="card"><b>The end.</b><p class="crumb" style="margin:6px 0 12px">This was one path out of several. Different choices lead to different scenes.</p><div class="row"><button class="btn" data-cta>${esc(m.cta)}</button><button class="btn g" data-restart>Start over</button></div></div>` :
      `<div class="choices" role="group" aria-label="Choose what happens next">${s.choices.map(c => `<button class="choice" data-choose="${esc(c.id)}" data-label="${esc(c.label)}"><span>${esc(c.label)}</span><span aria-hidden="true">→</span></button>`).join('')}</div>`) + '</div>';
}

function settings() {
  const I = S.integrations;
  const tokenCard = (S.health && S.health.auth_required) || S.needToken || TOKEN ? `<div class="card" style="margin-bottom:16px"><h2 style="font-size:18px">Access token</h2><p class="crumb">This server asks for a token. It is stored only in this browser.</p><label for="tok">Token</label><input id="tok" type="password" autocomplete="off" value="${esc(TOKEN)}"><div class="row" style="margin-top:10px"><button class="btn sm" data-savetoken>Save token</button></div></div>` : '';
  const card = i => {
    const [cls, lab] = STATE_LABEL[i.state] || ['wr', i.state]; const ev = i.evidence || {}, ls = ev.last_success, d = i.details || {}; const t = testResults[i.id];
    return `<div class="integ"><div class="row" style="justify-content:space-between"><h3>${esc(i.name)}</h3><span class="st ${cls}">${esc(lab)}</span></div><div>${esc(i.role)}</div>${i.problem ? `<div class="err-text">${esc(i.problem)}</div>` : ''}<dl class="kv"><dt>Used as</dt><dd>${esc(i.in_use_as)}</dd>${d.model ? `<dt>Model</dt><dd>${esc(d.model)}</dd>` : ''}${d.endpoint_host ? `<dt>Endpoint host</dt><dd>${esc(d.endpoint_host)}</dd>` : ''}${d.declared_endpoint_kind ? `<dt>Declared type</dt><dd>${esc(d.declared_endpoint_kind)}</dd>` : ''}${ev.calls_recorded != null ? `<dt>Calls recorded</dt><dd>${ev.calls_recorded}</dd>` : ''}${ls ? `<dt>Last success</dt><dd>${esc(ago(ls.ts))} · ${fmtMs(ls.latency_ms)}${ls.input_tokens != null ? ' · ' + fmtN(ls.input_tokens) + ' in / ' + fmtN(ls.output_tokens) + ' out tokens' : ''} · host ${esc(ls.endpoint_host)}</dd>` : ''}${ev.last_error ? `<dt>Last error</dt><dd class="err-text">${esc(ev.last_error.error_code)}: ${esc(ev.last_error.error_message || '')}</dd>` : ''}${i.module ? `<dt>Code</dt><dd>${esc(i.module)}</dd>` : ''}</dl><div class="crumb">${esc(i.caveat)}</div>${['amd', 'gemma', 'pollinations_image', 'evolus', 'evolus_tone'].includes(i.id) ? `<div class="row"><button class="btn g sm" data-test="${esc(i.id)}" ${!i.configured || busy.has('test:' + i.id) ? 'disabled' : ''}>${busy.has('test:' + i.id) ? 'Testing…' : 'Test connection'}</button>${i.id === 'pollinations_image' ? '<small class="crumb">Generates one small test image.</small>' : '<small class="crumb">Makes one tiny request.</small>'}</div>` : ''}${t ? `<div class="banner ${t.ok ? 'ok' : 'err'}" role="status"><div class="grow">${t.ok ? '<b>It worked.</b>' + esc(fmtMs(t.latency_ms)) + (t.model ? ' · model ' + esc(t.model) : '') + (t.endpoint_host ? ' · ' + esc(t.endpoint_host) : '') : '<b>Test failed.</b>' + esc(t.error ? t.error.message : t.message || '')}</div></div>` : ''}</div>`;
  };
  return `<h1 style="font-size:32px;margin-bottom:14px">Settings</h1>${tokenCard}<h2 style="font-size:20px;margin:6px 0 4px">Connections to AI services</h2><p class="crumb" style="margin:0 0 12px">Live status from the server. "Verified" only appears after a real call succeeded; this page never shows planned services as connected.</p>${S.integErr ? errBanner('Could not load status.', ' ' + S.integErr) : ''}${I ? `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">${I.integrations.map(card).join('')}</div>` : '<div class="card" style="text-align:center;padding:40px"><div class="spin"></div></div>'}${amdProofCard()}<div class="card" style="margin-top:16px"><h2 style="font-size:18px">Stored in this browser</h2><p class="crumb">Theme, your anonymous viewer id (used for story statistics), an unfinished campaign draft and the access token. Campaigns and brand guide live on the server.</p><button class="btn g" data-reset>Clear browser data</button></div>`;
}

/* ---------- actions ---------- */
async function guarded(key, fn) { if (busy.has(key)) return; busy.add(key); render(); try { return await fn(); } catch (e) { toast(e.message); } finally { busy.delete(key); render(); } }
async function refreshCur() { if (cur) { await loadCurrent(cur.id, true); } }

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return; const D = t.dataset;
  if (D.v) { if (D.v === view && !cur && !story) return; if (view === 'brand' && bdraft && bdraft._dirty && !confirm('You have unsaved brand changes. Leave without saving?')) return; return go(D.v); }
  if (D.audience !== undefined) { selectedTemplate = +D.audience; if (view !== 'audience') return go('audience'); return render(); }
  if (D.useAudience !== undefined) { const a = TEMPLATES[+D.useAudience]; if (wiz && wiz.d && !wiz.editId && !confirm('Replace your unfinished campaign draft with this audience?')) return; await loadBrand(); cur = null; view = 'studio'; wiz = newWiz(); wiz.d.audiences = [{ name: a.name, interests: a.interests.replaceAll(' · ', ', '), needs: a.need, angle: a.preset, context: '', source: 'template' }]; saveDraft(); sync(); render(1); toast('Audience template added'); return; }
  if (D.format) { mediaSel.fmt = D.format; return render(); }
  if (D.go) { if (D.go[0] === '#') { const n = $(D.go); if (n) n.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); return; } return go(D.go); }
  if (D.open !== undefined) return openCampaign(D.open);
  if (D.dup) return guarded('dup', async () => { const n = await api('POST', '/api/campaigns/' + D.dup + '/duplicate'); toast('Brief duplicated (no generated content)'); await openCampaign(n.id); });
  if (D.del) { if (!confirm('Delete this campaign and its images? This cannot be undone.')) return; return guarded('del', async () => { await api('DELETE', '/api/campaigns/' + D.del); cur = null; toast('Campaign deleted'); go('overview'); }); }
  if ('next' in D) { if (validate()) { wiz.step++; saveDraft(); return render(1); } render(); const f = document.querySelector('[aria-invalid="true"],#aud-err'); if (f && f.focus) f.focus(); else document.querySelector('[data-a]')?.focus(); return; }
  if ('back' in D) { wiz.step--; saveDraft(); return render(1); }
  if ('add' in D && wiz.d.audiences.length < 5) { wiz.d.audiences.push({ name: 'New audience', interests: '', needs: '', angle: 'Performance', context: '', source: 'user' }); saveDraft(); return render(); }
  if (D.rm !== undefined) { wiz.d.audiences.splice(+D.rm, 1); saveDraft(); return render(); }
  if ('gen' in D) return submitWizard();
  if ('canceledit' in D) { wiz = null; clearDraft(); wizFile = null; return cur ? openCampaign(cur.id) : go('overview'); }
  if ('edit' in D) { const c = cur; wiz = { step: 0, errs: {}, editId: c.id, d: { brand: c.brand, product: c.product, desc: c.description, objective: c.objective, name: c.name, tone: c.tone, values: c.values || '', facts: c.facts.join('\n'), avoid: c.avoid.join(', '), language: c.language, discount: c.approved_discount || '', audiences: c.audiences.map(a => ({ id: a.id, name: a.name, interests: a.interests, needs: a.needs, angle: a.angle, context: a.context, source: a.source })) } }; clearTimeout(watchTimer); cur = null; sync(); return render(1); }
  if ('regen' in D) { if (cur.experiences.some(x => x.status === 'ready') && !confirm('Regenerate all audiences? This replaces the current text and removes its images, and calls the AI again.')) return; return guarded('regen', async () => { await api('POST', '/api/campaigns/' + cur.id + '/generate', {}); await loadCurrent(cur.id, true); }); }
  if (D.regenExp) { if (!confirm('Regenerate this audience\'s experience? The current text and images are replaced.')) return; return guarded('regen:' + D.regenExp, async () => { await api('POST', '/api/experiences/' + D.regenExp + '/regenerate'); await loadCurrent(cur.id, true); }); }
  if ('tonecheck' in D) return guarded('tone', async () => { await api('POST', '/api/campaigns/' + cur.id + '/tone-check'); await loadCurrent(cur.id, true); });
  if ('rereview' in D) return guarded('review', async () => { await api('POST', '/api/campaigns/' + cur.id + '/review', { ai: true }); await loadCurrent(cur.id, true); });
  if (D.genimg) { const [id, scope] = D.genimg.split('|'); return guarded('img:' + id + ':' + scope, async () => { const r = await api('POST', '/api/experiences/' + id + '/images', { scope: scope === 'scenes' ? 'scenes' : 'hero' }); if (r.message) toast(r.message); await loadCurrent(cur.id, true); }); }
  if (D.genad) { const [id, ar] = D.genad.split('|'); return guarded('ad:' + id + ar, async () => { await api('POST', '/api/experiences/' + id + '/images', { scope: 'hero', aspect_ratio: ar }); await loadCurrent(mediaSel.cid, true); }); }
  if (D.imgretry) return guarded('retry:' + D.imgretry, async () => { await api('POST', '/api/images/' + D.imgretry + '/retry'); await loadCurrent(cur.id, true); });
  if (D.play) { view = 'story'; await openStory(D.play); sync(); return; }
  if ('storyback' in D) { if (cur) return openCampaign(cur.id); return go('overview'); }
  if (D.choose) { story.loading = false; try { await playStep(story.scene.id, D.choose, D.label); } catch (er) { toast(er.message); } render(); (document.querySelector('.story h1') || {}).focus?.(); return; }
  if ('restart' in D) { story.loading = true; render(); try { await playStep(); } catch (er) { story.err = er.message; } story.loading = false; render(1); return; }
  if ('cta' in D) { try { await api('POST', '/api/events', { session_id: SESSION, type: 'cta_clicked', experience_id: story.expId }); toast('Call to action recorded. (In a real campaign this would open your product page.)'); } catch (er) { toast(er.message); } return; }
  if (D.edittext) { const x = cur.experiences.find(z => z.id === D.edittext); edit = { id: x.id, headline: x.headline, body_copy: x.body_copy, cta: x.cta }; return render(); }
  if ('canceltext' in D) { edit = null; return render(); }
  if ('saveedit' in D) return guarded('edit', async () => { await api('PATCH', '/api/experiences/' + edit.id, { headline: edit.headline, body_copy: edit.body_copy, cta: edit.cta }); edit = null; toast('Saved. Fixed-rule checks re-run.'); await loadCurrent(cur.id, true); });
  if (D.translate) { const c0 = cur, lang = trPick[D.translate] || trLangs(c0)[0]; return guarded('tr:' + D.translate, async () => { const r = await api('POST', '/api/experiences/' + D.translate + '/translate', { languages: [lang] }); await loadTranslations(c0.id); const bad = (r.results || []).filter(z => !z.ok); toast(bad.length ? 'Translation failed: ' + (bad[0].error && bad[0].error.message) : 'Translated into ' + lang + '.'); }); }
  if (D.copy) { const [id, k] = D.copy.split('.'); const x = cur.experiences.find(z => z.id === id); return navigator.clipboard?.writeText(x[k]).then(() => toast('Copied'), () => toast('Your browser blocked copying. Select the text and copy it manually.')); }
  if (D.copyad) { const x = cur.experiences.find(z => z.id === D.copyad); return navigator.clipboard?.writeText(x.headline + '\n' + x.body_copy + '\n' + x.cta).then(() => toast('Ad text copied'), () => toast('Your browser blocked copying.')); }
  if ('savebrand' in D) { const b = bdraft || { name: S.brand.name, tone: S.brand.tone, values: S.brand.values, facts: (S.brand.facts || []).join('\n'), avoid: (S.brand.avoid || []).join(', ') }; if (!String(b.name).trim()) { bdraft = { ...b, _err: 'Enter a brand name before saving.', _dirty: 1 }; render(); $('#b-name').focus(); return; } return guarded('brand', async () => { S.brand = await api('PUT', '/api/brand', { name: b.name.trim(), tone: b.tone, values: b.values, facts: lines(b.facts), avoid: csv(b.avoid) }); bdraft = null; toast('Brand guide saved'); }); }
  if ('clearbrand' in D) { if (!confirm('Clear the saved brand guide? Saved campaigns are not affected.')) return; return guarded('brand', async () => { await api('DELETE', '/api/brand'); S.brand = { name: '', tone: 'Confident', values: '', facts: [], avoid: [] }; bdraft = null; toast('Brand guide cleared'); }); }
  if (D.test) return guarded('test:' + D.test, async () => { try { testResults[D.test] = await api('POST', '/api/integrations/' + D.test + '/test'); } catch (er) { testResults[D.test] = { ok: false, error: { message: er.message } }; } S.integrations = await api('GET', '/api/integrations'); await loadHealth(); });
  if ('savetoken' in D) { TOKEN = ($('#tok').value || '').trim(); if (TOKEN) store.set('vyra.token', TOKEN); else store.del('vyra.token'); S.needToken = false; toast('Token saved'); await loadHealth(); return loadForView(); }
  if ('reset' in D) { if (!confirm('Clear theme, viewer id, draft and token stored in this browser? Server data is not touched.')) return; ['vyra.theme', 'vyra.session', DK, 'vyra.token'].forEach(store.del); TOKEN = ''; toast('Browser data cleared. Reload to start a fresh viewer session.'); return; }
});
document.addEventListener('input', e => {
  const t = e.target, D = t.dataset;
  if (D.k && wiz) { wiz.d[D.k] = t.value; saveDraft(); }
  else if (D.a && wiz) { const [i, k] = D.a.split('.'); wiz.d.audiences[i][k] = t.value; if (k !== 'angle') wiz.d.audiences[i].source = wiz.d.audiences[i].source === 'template' ? 'user' : wiz.d.audiences[i].source; saveDraft(); }
  else if (D.b) { bdraft = bdraft || { name: S.brand.name, tone: S.brand.tone, values: S.brand.values, facts: (S.brand.facts || []).join('\n'), avoid: (S.brand.avoid || []).join(', ') }; bdraft[D.b] = t.value; bdraft._dirty = 1; }
  else if (D.ed && edit) { edit[D.ed] = t.value; }
  else if (t.id === 'q') { q = t.value; const p = t.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fs') { fs = t.value; render(); }
  else if (t.id === 'f-photo') { const f = t.files && t.files[0]; if (f && f.size > 5 * 1024 * 1024) { toast('That photo is larger than 5 MB.'); t.value = ''; wizFile = null; } else wizFile = f || null; render(); }
  else if (t.id === 'm-camp') { mediaSel.cid = t.value; mediaSel.aud = 0; loadCurrent(t.value, true); }
  else if (t.dataset.trpick) { trPick[t.dataset.trpick] = t.value; }
  else if (t.id === 'm-aud') { mediaSel.aud = +t.value; render(); }
  else if (t.dataset.k || t.dataset.a) { saveDraft(); }
  else if (t.dataset.b) { render(); }
});
window.addEventListener('hashchange', () => { fromHash(); });
window.addEventListener('beforeunload', e => { if (bdraft && bdraft._dirty) { e.preventDefault(); e.returnValue = ''; } });
$('#theme').onclick = () => setTheme(theme() === 'dark' ? 'light' : 'dark');
try { const t = store.get('vyra.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
setTheme(theme());
(async function boot() { loadHealth(); await loadBrand(); await fromHash(); })();

</script>
<script>
/* Visual-only helper: lets cards catch a soft light that follows the cursor. Touches no app state. */
(function(){try{if(matchMedia('(prefers-reduced-motion:reduce)').matches||!matchMedia('(hover:hover)').matches)return;
var sel='.card,.aud,.stat,.integ,.persona,.persona-detail,.media-controls,.creative-preview,.guide,.choice';var raf=0,last=null;
document.addEventListener('pointermove',function(e){last=e;if(raf)return;raf=requestAnimationFrame(function(){raf=0;
var el=last.target&&last.target.closest&&last.target.closest(sel);if(!el)return;var r=el.getBoundingClientRect();
el.style.setProperty('--mx',(last.clientX-r.left)+'px');el.style.setProperty('--my',(last.clientY-r.top)+'px');});},{passive:true});}catch(_){}})();
</script></body></html>
